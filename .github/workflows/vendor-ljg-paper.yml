name: Vendor ljg-paper Skill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-ljg-paper.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ljg-skills master as ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ljg /tmp/ljg.zip
          curl -L --fail --retry 3 \
            https://github.com/Pyrojewel-zard/ljg-skills/archive/refs/heads/master.zip \
            -o /tmp/ljg.zip
          mkdir -p /tmp/ljg
          unzip -q /tmp/ljg.zip -d /tmp/ljg

      - name: Copy ljg-paper into project skill directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agents/skills/ljg-paper
          mkdir -p .agents/skills/ljg-paper
          cp -a /tmp/ljg/ljg-skills-master/skills/ljg-paper/. .agents/skills/ljg-paper/

          upstream_sha=$(git ls-remote https://github.com/Pyrojewel-zard/ljg-skills.git refs/heads/master | awk '{print $1}')
          cat > .agents/skills/ljg-paper/UPSTREAM_VENDOR_INFO.md <<EOF
          # Vendored upstream information

          - Upstream: https://github.com/Pyrojewel-zard/ljg-skills
          - Branch: master
          - Commit: ${upstream_sha}
          - Source directory: skills/ljg-paper
          - Vendored by: .github/workflows/vendor-ljg-paper.yml
          - Method: GitHub source ZIP download and extraction
          EOF

      - name: Commit vendored ljg-paper skill
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/ljg-paper
          if git diff --cached --quiet; then
            echo "Vendored ljg-paper is already up to date."
            exit 0
          fi
          git commit -m "vendor: import ljg-paper skill"
          git push origin HEAD:main
