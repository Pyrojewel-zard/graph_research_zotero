name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MKG_SOURCE_PATH: ${{ github.workspace }}/vendor/meta-knowledge-graph
      PYTHONPATH: ${{ github.workspace }}/vendor/meta-knowledge-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify vendored MKG
        run: test -f vendor/meta-knowledge-graph/mkg/__init__.py
      - name: Ruff
        run: ruff check src tests
      - name: Pytest integration package
        run: pytest -q tests
      - name: CLI import smoke test
        run: python -c "from graph_research_zotero.cli import app; print(app.info.help)"
