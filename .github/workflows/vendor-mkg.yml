name: Vendor Meta Knowledge Graph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-mkg.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download MKG main as ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mkg /tmp/mkg.zip
          curl -L --fail --retry 3 \
            https://github.com/Seaual/meta-knowledge-graph/archive/refs/heads/main.zip \
            -o /tmp/mkg.zip
          mkdir -p /tmp/mkg
          unzip -q /tmp/mkg.zip -d /tmp/mkg

      - name: Copy upstream source into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/meta-knowledge-graph
          mkdir -p vendor/meta-knowledge-graph
          cp -a /tmp/mkg/meta-knowledge-graph-main/. vendor/meta-knowledge-graph/

          upstream_sha=$(git ls-remote https://github.com/Seaual/meta-knowledge-graph.git refs/heads/main | awk '{print $1}')
          cat > vendor/meta-knowledge-graph/UPSTREAM_VENDOR_INFO.md <<EOF
          # Vendored upstream information

          - Upstream: https://github.com/Seaual/meta-knowledge-graph
          - Branch: main
          - Commit: ${upstream_sha}
          - Vendored by: .github/workflows/vendor-mkg.yml
          - Method: GitHub source ZIP download and extraction

          The upstream LICENSE is preserved in this directory.
          EOF

      - name: Commit vendored MKG source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/meta-knowledge-graph
          if git diff --cached --quiet; then
            echo "Vendored MKG is already up to date."
            exit 0
          fi
          git commit -m "vendor: import Meta Knowledge Graph source"
          git push origin HEAD:main
