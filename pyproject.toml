[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graph-research-zotero"
version = "0.1.0"
description = "Bridge Zotero MCP literature/embeddings into vendored Meta Knowledge Graph research discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.5",
  "rich>=13.7.1",
  "requests>=2.31.0",
  "pydantic>=2.6.0",
  "pymupdf>=1.24.0",
  "markitdown>=0.1.0",
  "pypinyin>=0.51.0",
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "python-multipart>=0.0.6",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "deepagents==0.5.1",
  "cryptography>=42.0.0",
  "semanticscholar>=0.11.0",
  "langgraph-checkpoint-sqlite>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[project.scripts]
grz = "graph_research_zotero.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_research_zotero"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
